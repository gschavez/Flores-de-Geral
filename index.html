<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonito día amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital@1&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#fff3da;
    --sky-2:#ffe0bf;
    --sky-3:#ffc9a8;
    --petal:#f8c93f;
    --petal-light:#fce089;
    --petal-dark:#eda528;
    --center:#8a5a30;
    --center-dark:#5c3719;
    --stem:#6a9455;
    --stem-dark:#436b39;
    --leaf:#7ba360;
    --paper:#f2e6ca;
    --paper-mid:#e6d5ac;
    --paper-dark:#cdb587;
    --ribbon:#e8836b;
    --ribbon-dark:#c4644d;
    --white-petal:#fffdf7;
    --ink:#5a4632;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html,body{height:100%;margin:0;}
  body{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.65), transparent 45%),
      radial-gradient(circle at 12% 85%, rgba(255,255,255,0.3), transparent 40%),
      linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
    font-family:'Nunito',-apple-system,sans-serif;
    color:var(--ink);
    padding:32px 16px;
    overflow:hidden;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sky-1:#2c2216; --sky-2:#241b12; --sky-3:#1a130d; --ink:#f1e6d4;
    }
  }
  :root[data-theme="dark"]{ --sky-1:#2c2216; --sky-2:#241b12; --sky-3:#1a130d; --ink:#f1e6d4; }

  /* Rayos de sol sutiles */
  .rayos{
    position:absolute; inset:-10% -10% auto -10%; height:70%;
    background:conic-gradient(from -30deg at 50% 0%,
      transparent 0deg, rgba(255,255,255,0.18) 4deg, transparent 9deg,
      transparent 16deg, rgba(255,255,255,0.14) 20deg, transparent 25deg,
      transparent 32deg, rgba(255,255,255,0.18) 36deg, transparent 41deg,
      transparent 48deg, rgba(255,255,255,0.14) 52deg, transparent 57deg,
      transparent 64deg, rgba(255,255,255,0.18) 68deg, transparent 73deg,
      transparent 80deg, rgba(255,255,255,0.14) 84deg, transparent 89deg);
    pointer-events:none; z-index:0;
    animation:girar 90s linear infinite;
    transform-origin:50% 0%;
  }
  @keyframes girar{ to{ transform:rotate(360deg); } }

  .bokeh{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .bokeh span{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.75), rgba(255,255,255,0) 70%);
    opacity:0.55;
  }

  /* Petalos cayendo */
  .petalos{ position:fixed; inset:0; pointer-events:none; z-index:2; }
  .petalo{
    position:absolute; top:-40px; font-size:20px;
    animation-name:caer, balanceo;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite;
    opacity:0.9; filter:drop-shadow(0 2px 2px rgba(90,60,20,0.15));
  }
  @keyframes caer{ to{ top:110%; } }
  @keyframes balanceo{ 0%,100%{ margin-left:0; } 50%{ margin-left:36px; } }

  .stage{ position:relative; z-index:1; width:100%; max-width:560px; text-align:center; }

  h1{
    font-family:'Playfair Display', serif; font-style:italic; font-weight:400;
    font-size:1.15rem; color:var(--ribbon-dark); letter-spacing:2px;
    text-transform:uppercase; margin:0 0 4px; opacity:0.85;
  }
  .subrayo{
    width:70px; height:2px; margin:0 auto 22px; border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--petal-dark), transparent);
  }

  .bouquet-wrap{ position:relative; width:100%; max-width:440px; margin:0 auto; }

  .flor-anim{ transform-box:fill-box; transform-origin:50% 100%; animation:mecer 5s ease-in-out infinite; }
  .flor-anim.d1{ animation-delay:.2s; }
  .flor-anim.d2{ animation-delay:.6s; }
  .flor-anim.d3{ animation-delay:1s; }
  .flor-anim.d4{ animation-delay:.4s; }
  @keyframes mecer{ 0%,100%{ transform:rotate(-1.4deg);} 50%{ transform:rotate(1.4deg);} }

  .card{
    margin-top:22px; display:inline-flex; align-items:center; justify-content:center;
    background:#fffaf0; border-radius:18px; padding:16px 36px;
    box-shadow:0 14px 30px rgba(120,90,50,0.2), 0 0 0 1px rgba(233,169,50,0.15) inset;
    transform:rotate(-2deg);
    animation:aparecer .9s ease-out both;
  }
  .card span{
    font-family:'Caveat',cursive; font-size:2.3rem; font-weight:700;
    color:var(--ribbon-dark); letter-spacing:0.5px;
  }
  @keyframes aparecer{ from{ opacity:0; transform:translateY(14px) rotate(-2deg);} to{ opacity:1; transform:translateY(0) rotate(-2deg);} }

  .mensaje{
    max-width:380px; margin:18px auto 0; font-size:0.98rem; line-height:1.6;
    color:var(--ink); opacity:0.8;
  }

  @media (max-width:380px){ .card span{ font-size:1.9rem; } }
</style>
</head>
<body>

<div class="rayos" aria-hidden="true"></div>

<div class="bokeh" aria-hidden="true">
  <span style="width:130px;height:130px;top:5%;left:6%;"></span>
  <span style="width:70px;height:70px;top:12%;left:72%;"></span>
  <span style="width:50px;height:50px;top:28%;left:88%;"></span>
  <span style="width:90px;height:90px;top:68%;left:2%;"></span>
  <span style="width:40px;height:40px;top:6%;left:46%;"></span>
</div>

<div class="petalos" aria-hidden="true">
  <span class="petalo" style="left:8%; animation-duration:9s, 3s;">🌼</span>
  <span class="petalo" style="left:22%; animation-duration:12s, 4s; animation-delay:1s, 0s; font-size:14px;">🌼</span>
  <span class="petalo" style="left:40%; animation-duration:10s, 3.5s; animation-delay:3s, 0s;">🌼</span>
  <span class="petalo" style="left:63%; animation-duration:13s, 4.5s; animation-delay:2s, 0s; font-size:16px;">🌼</span>
  <span class="petalo" style="left:78%; animation-duration:11s, 3.8s; animation-delay:.5s, 0s;">🌼</span>
  <span class="petalo" style="left:90%; animation-duration:14s, 4s; animation-delay:4s, 0s; font-size:14px;">🌼</span>
</div>

<div class="stage">

  <h1>Para ti</h1>
  <div class="subrayo"></div>

  <div class="bouquet-wrap">
    <svg viewBox="0 0 420 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramo de girasoles">

      <defs>
        <radialGradient id="centerGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="var(--center)"/>
          <stop offset="100%" stop-color="var(--center-dark)"/>
        </radialGradient>
        <linearGradient id="paperGrad" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="var(--paper)"/>
          <stop offset="55%" stop-color="var(--paper-mid)"/>
          <stop offset="100%" stop-color="var(--paper-dark)"/>
        </linearGradient>
        <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5c3d1e" flood-opacity="0.24"/>
        </filter>

        <g id="sunflower">
          <g id="outer" fill="var(--petal)">
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(30)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(60)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(90)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(120)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(150)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(180)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(210)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(240)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(270)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(300)"/>
            <path d="M0,0 C-9,-18 -7,-46 0,-64 C7,-46 9,-18 0,0 Z" transform="rotate(330)"/>
          </g>
          <g id="inner" fill="var(--petal-light)" transform="rotate(15)">
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(30)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(60)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(90)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(120)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(150)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(180)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(210)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(240)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(270)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(300)"/>
            <path d="M0,0 C-6,-14 -5,-34 0,-46 C5,-34 6,-14 0,0 Z" transform="rotate(330)"/>
          </g>
          <circle r="26" fill="url(#centerGrad)"/>
          <g fill="var(--center-dark)" opacity="0.55">
            <circle cx="0" cy="0" r="2.2"/><circle cx="9" cy="-4" r="2"/><circle cx="6" cy="9" r="2"/>
            <circle cx="-7" cy="7" r="2"/><circle cx="-9" cy="-5" r="2"/><circle cx="0" cy="-13" r="1.8"/>
            <circle cx="13" cy="4" r="1.8"/><circle cx="4" cy="15" r="1.8"/><circle cx="-13" cy="4" r="1.8"/>
            <circle cx="-4" cy="-14" r="1.8"/>
          </g>
          <circle r="26" fill="none" stroke="var(--center-dark)" stroke-width="1.2" opacity="0.35"/>
        </g>
      </defs>

      <ellipse cx="212" cy="416" rx="118" ry="14" fill="#5c3d1e" opacity="0.16"/>

      <g filter="url(#softShadow)">

        <g stroke="var(--stem-dark)" stroke-width="5" fill="none" stroke-linecap="round">
          <path d="M212 177 C 210 220, 212 270, 212 340"/>
          <path d="M158 199 C 150 240, 175 285, 195 340"/>
          <path d="M268 201 C 274 244, 250 288, 230 340"/>
          <path d="M128 259 C 120 285, 140 305, 172 340"/>
          <path d="M296 261 C 300 288, 280 305, 252 340"/>
        </g>

        <g fill="var(--leaf)">
          <path d="M186 280 C 158 270, 138 282, 132 302 C 162 302, 180 292, 186 280 Z"/>
          <path d="M234 284 C 262 273, 284 285, 290 305 C 260 306, 240 296, 234 284 Z"/>
        </g>
        <g stroke="var(--stem-dark)" stroke-width="1.2" opacity="0.5" fill="none">
          <path d="M186 280 C 170 280 152 288 136 298"/>
          <path d="M234 284 C 252 280 270 288 286 300"/>
        </g>

        <g>
          <g transform="translate(108,235)">
            <circle cx="-8" cy="-6" r="6" fill="var(--white-petal)"/>
            <circle cx="8" cy="-8" r="6" fill="var(--white-petal)"/>
            <circle cx="0" cy="6" r="6" fill="var(--white-petal)"/>
            <circle cx="0" cy="0" r="4" fill="var(--petal-dark)"/>
          </g>
          <g transform="translate(304,238)">
            <circle cx="-8" cy="-6" r="6" fill="var(--white-petal)"/>
            <circle cx="8" cy="-8" r="6" fill="var(--white-petal)"/>
            <circle cx="0" cy="6" r="6" fill="var(--white-petal)"/>
            <circle cx="0" cy="0" r="4" fill="var(--petal-dark)"/>
          </g>
        </g>

        <path d="M138 302 L286 302 L332 406 L92 406 Z" fill="url(#paperGrad)"/>
        <g stroke="var(--paper-dark)" stroke-width="1.4" opacity="0.55" fill="none">
          <path d="M150 302 L110 406"/>
          <path d="M212 302 L212 406"/>
          <path d="M274 302 L314 406"/>
        </g>
        <path d="M92 406 L332 406 L322 380 L102 380 Z" fill="var(--paper-dark)" opacity="0.35"/>

        <path d="M118 300 Q212 334 306 300 L292 344 Q212 364 132 344 Z" fill="var(--ribbon)"/>
        <path d="M118 300 Q212 334 306 300" fill="none" stroke="var(--ribbon-dark)" stroke-width="2.4"/>
        <path d="M292 344 L318 380 L296 386 Z" fill="var(--ribbon-dark)"/>
        <path d="M132 344 L106 380 L128 386 Z" fill="var(--ribbon-dark)"/>
        <g transform="translate(212,318)">
          <path d="M0,0 C-26,-16 -34,10 -4,8 Z" fill="var(--ribbon)"/>
          <path d="M0,0 C26,-16 34,10 4,8 Z" fill="var(--ribbon)"/>
          <path d="M0,0 C-26,-16 -34,10 -4,8 Z" fill="none" stroke="var(--ribbon-dark)" stroke-width="1.6"/>
          <path d="M0,0 C26,-16 34,10 4,8 Z" fill="none" stroke="var(--ribbon-dark)" stroke-width="1.6"/>
          <circle r="8" fill="var(--ribbon-dark)"/>
        </g>

        <g class="flor-anim d1"><use href="#sunflower" transform="translate(128,238) rotate(-16) scale(0.82)"/></g>
        <g class="flor-anim d2"><use href="#sunflower" transform="translate(296,240) rotate(16) scale(0.82)"/></g>
        <g class="flor-anim d3"><use href="#sunflower" transform="translate(158,182) rotate(-6) scale(0.66)"/></g>
        <g class="flor-anim d4"><use href="#sunflower" transform="translate(268,184) rotate(6) scale(0.66)"/></g>
        <g class="flor-anim"><use href="#sunflower" transform="translate(212,150) scale(1.05)"/></g>

      </g>
    </svg>
  </div>

  <div class="card">
    <span>Bonito día, linda</span>
  </div>

  <p class="mensaje">Ten un día cálido y bonito como un campo de girasoles.<br>Pdt: te debo las reales, amor xdd 🌻</p>

</div>

</body>
</html>
